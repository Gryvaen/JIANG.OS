services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["3720:3720"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiang_os
      POSTGRES_USER: jiang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jiang -d jiang_os"], interval: 5s, timeout: 3s, retries: 12 }
volumes:
  postgres_data:
